<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PrintReady</title>

<!-- OpenCV -->
<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f5f7fb;
    color:#111827;
}

.container{
    max-width:620px;
    margin:auto;
    padding:24px 16px 50px;
}

header{
    margin-bottom:24px;
}

.logo{
    font-size:31px;
    font-weight:800;
    letter-spacing:-1.2px;
}

.tagline{
    margin-top:6px;
    color:#6b7280;
    font-size:15px;
}

.card{
    background:#ffffff;
    border-radius:22px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:
        0 8px 30px rgba(15,23,42,.06);
}

.card h2{
    margin:0 0 7px;
    font-size:20px;
}

.card p{
    margin:0 0 16px;
    color:#6b7280;
    font-size:14px;
    line-height:1.55;
}

.upload{
    width:100%;
    min-height:76px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:2px dashed #cbd5e1;
    border-radius:17px;

    background:#f8fafc;

    color:#111827;
    font-size:16px;
    font-weight:500;

    cursor:pointer;
}

.upload:active{
    background:#eef2f7;
}

.upload input{
    display:none;
}

.preview{
    width:100%;
    max-height:500px;

    object-fit:contain;

    display:block;

    margin-top:16px;

    border-radius:15px;

    background:#f1f5f9;
}

.status{
    margin-top:10px;
    font-size:13px;
    line-height:1.45;
    color:#64748b;
}

.actions{
    display:flex;
    gap:9px;
    margin-top:12px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:14px;
    padding:13px 17px;

    font-size:15px;
    font-weight:700;

    cursor:pointer;
}

.primary{
    width:100%;
    padding:17px;

    background:#111827;
    color:white;

    font-size:16px;
}

.secondary{
    background:#eef2ff;
    color:#3730a3;
}

.info{
    background:#eff6ff;
    color:#1e40af;

    border-radius:16px;

    padding:16px;

    font-size:13px;
    line-height:1.55;
}

.hidden{
    display:none !important;
}

   LOADING
============================ */

    position:fixed;
    inset:0;

    z-index:99999;

    background:rgba(255,255,255,.92
